services:
  db:
    image: postgres:16-alpine
    container_name: library-app-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library_postgres
      POSTGRES_PASSWORD: library_postgres
    ports:
      - "5433:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
      - ./docker/create_db.sql:/docker-entrypoint-initdb.d/10-create_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_postgres -d library"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: library-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    expose:
      - "9000"
    volumes:
      - app_code:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: library-app-nginx
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    build: .
    container_name: library-app-scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"

volumes:
  library_pgdata:
  app_code:
